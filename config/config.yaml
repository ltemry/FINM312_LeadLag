# =============================================================================
# FINM312 Lead-Lag: project configuration (follows docs/project_plan.md)
#
# All tickers, contracts, and dates live here, not in the code.
# Keep date selection fixed before inspecting lead-lag results.
# =============================================================================

project:
  data_dir: data                 # relative to the repo root
  market_timezone: America/New_York
  # Extra full-day US equity closures not covered by the standard NYSE rules.
  extra_market_closures:
    - "2025-01-09"               # National Day of Mourning (President Carter)

# -----------------------------------------------------------------------------
# Instruments. Legs:
#   equity  -> WRDS TAQ (cash equity)
#   perp    -> Hyperliquid HIP-3 perpetual (candles via Dwellir; metadata via Hyperliquid API)
#   futures -> Databento CME (zero-cost guarded)
# `deferred: true` blocks every collector for that instrument.
# -----------------------------------------------------------------------------
instruments:

  NVDA:
    equity:
      symbol: NVDA
      taq_sym_root: NVDA
      taq_sym_suffix: ""
      primary_exchange: Q          # TAQ exchange code: Q = Nasdaq (official open/close source)
    perp:
      coin: "xyz:NVDA"
      dex: xyz
      deployer: "0x88806a71d74ad0a510b350545c9ae490912f0888"
      contract_units: "verify with deployer docs"

  TSLA:
    equity:
      symbol: TSLA
      taq_sym_root: TSLA
      taq_sym_suffix: ""
      primary_exchange: Q
    perp:
      coin: "xyz:TSLA"
      dex: xyz
      deployer: "0x88806a71d74ad0a510b350545c9ae490912f0888"
      contract_units: "verify with deployer docs"
    futures:
      # CME single-stock futures (launched July 27, 2026). The Databento symbol
      # is NOT the cash ticker. Resolve it first (free symbology call):
      #   leadlag databento-resolve --symbols <candidate parent, e.g. XXX.FUT> --stype-in parent
      # then pin one liquid expiry here as a raw symbol. Collection is skipped
      # while symbol is null. Check coverage, units and liquidity before use.
      dataset: GLBX.MDP3
      symbol: null
      stype_in: raw_symbol
      multiplier: null             # shares per contract, from CME specs

  SP500:
    perp:
      coin: "xyz:SP500"
      dex: xyz
      deployer: "0x88806a71d74ad0a510b350545c9ae490912f0888"
      contract_units: "index points; verify with deployer docs"

  ES:
    futures:
      dataset: GLBX.MDP3
      # Fixed expiry, no back-adjusted/continuous series. ESU6 expired
      # 2026-09-18, so ESZ6 (expires 2026-12-18) is the front contract for
      # every window below. Exclude roll periods from event windows.
      symbol: ESZ6
      stype_in: raw_symbol
      multiplier: 50

  SPY:
    # Optional: actual ETF auction comparison for the S&P leg (different units
    # and tracking from SPX). Not in any default study.
    equity:
      symbol: SPY
      taq_sym_root: SPY
      taq_sym_suffix: ""
      primary_exchange: P          # NYSE Arca

  ANT:
    deferred: true                 # all Anthropic collection/analysis paused until resumed
    perp:
      coin: "xyz:ANT"
      dex: xyz

# -----------------------------------------------------------------------------
# Studies. Dates are US/Eastern calendar dates.
#   scored:    dates that count in the analysis (labels only)
#   retrieval: dates to download, including buffers before/after
# Each is either {start, end}, {dates: [...]}, or a list of such blocks.
#
# How retrieval dates map to each source:
#   taq                    -> NYSE trading days in the retrieval range
#   dwellir / hyperliquid  -> every UTC day that overlaps the ET retrieval
#                             range (perps trade 24/7, keeps weekends/overnights)
#   databento              -> same UTC days, minus Saturdays (CME closed)
# -----------------------------------------------------------------------------
studies:

  pilot:
    description: "Matching one-day TSLA pilot (TAQ vs Dwellir candles)"
    instruments: [TSLA]
    sources: [taq, dwellir]
    scored: {dates: ["2026-11-13"]}
    retrieval: {dates: ["2026-11-13"]}

  nvda_baseline:
    description: "NVDA candidate baseline (report vol/spreads/volume/news before calling it quiet)"
    instruments: [NVDA, ES]
    sources: [taq, dwellir, hyperliquid, databento]
    scored: {start: "2026-09-22", end: "2026-09-24"}
    retrieval: {start: "2026-09-21", end: "2026-09-24"}

  nvda_comparison:
    description: "NVDA earlier comparison window"
    instruments: [NVDA, ES]
    sources: [taq, dwellir, hyperliquid, databento]
    scored: {start: "2026-11-03", end: "2026-11-05"}
    retrieval: {start: "2026-11-02", end: "2026-11-05"}

  nvda_crisis:
    description: "NVDA CEO-transition case study (focus Nov 11-12; release dated Nov 12)"
    instruments: [NVDA, ES]
    sources: [taq, dwellir, hyperliquid, databento]
    scored: {start: "2026-11-09", end: "2026-11-13"}
    focus: {start: "2026-11-11", end: "2026-11-12"}
    retrieval: {start: "2026-11-06", end: "2026-11-13"}

  panel:
    description: "Broader TSLA / S&P panel (~30 cash sessions). Sep-Oct = development, Nov = evaluation"
    # Add NVDA here for the optional NVDA panel (adds ~55k Dwellir candles at 1m).
    instruments: [TSLA, SP500, ES]
    sources: [taq, dwellir, hyperliquid, databento]
    scored:
      - {start: "2026-09-21", end: "2026-10-16"}
      - {start: "2026-11-02", end: "2026-11-13"}
    # Each block starts at the previous trading day's close.
    retrieval:
      - {start: "2026-09-18", end: "2026-10-16"}
      - {start: "2026-10-30", end: "2026-11-13"}
    development: {start: "2026-09-21", end: "2026-10-16"}
    evaluation: {start: "2026-11-02", end: "2026-11-13"}

# -----------------------------------------------------------------------------
# Source settings
# -----------------------------------------------------------------------------
taq:
  library_pattern: "taqm_{year}"
  nbbo_table_pattern: "complete_nbbo_{yyyymmdd}"
  trades_table_pattern: "ctm_{yyyymmdd}"
  # Keep the LAST valid NBBO per bucket on the WRDS server (0 = no sampling).
  sample_seconds: 1
  session_start: "04:00:00"      # ET
  session_end: "20:00:00"        # ET
  drop_invalid_on_server: true   # non-positive or crossed NBBO; locked kept and flagged later
  collect_trades: true           # bucketed volume / count / VWAP / last (tr_corr = '00')
  # Sale conditions excluded from the continuous trade buckets: prints that do
  # not update the last-sale price or carry stale/out-of-sequence prices, plus
  # auction/official prints (collected separately below).
  #   B,W avg price | C cash | G bunched sold | H price variation | I odd lot
  #   M,Q official close/open | N next day | O,5,6 opening/reopening/closing prints
  #   P prior reference | R seller | T Form T (ext. hours) | U ext. hours out of seq.
  #   V contingent | Z sold out of sequence | 4 derivatively priced | 7 QCT | 9 corr. close
  trade_exclude_conditions: "BCGHIMNOPQRTUVWZ45679"
  # Opening/closing/official prints, all exchanges, unfiltered, stored
  # separately from continuous-trading data for auctions.py:
  #   O opening print, Q official open, 6 closing print, M official close, 5 reopening print
  collect_auction_trades: true
  auction_conditions: "OQ6M5"

dwellir:
  # Historical 1s/1m/5m trade-derived candles for Hyperliquid (incl. HIP-3).
  # API key: DWELLIR_API_KEY in .env (it is part of the URL, so URLs are never logged).
  base_url: https://api-hyperliquid-index.n.dwellir.com
  interval: "1m"                 # 1s only for selected event windows (--interval 1s)
  page_limit: 5000               # API max per page

  # ---- Free-usage guard (see docs/project_plan.md) -----------------------
  # Set to true ONLY after confirming, on your Dwellir account, that
  #   (1) the free plan includes the Index candle-range endpoint, and
  #   (2) there is no paid-overage route (free plan: overages not offered).
  # Until then only `leadlag dwellir-probe` (a few candles) is allowed.
  entitlement_verified: false
  plan: free
  daily_allowance: 100000        # published free-plan daily responses
  headroom_fraction: 0.20        # never plan to use more than 80% of the allowance
  quota_reset_timezone: UTC      # verify on the dashboard; the ledger buckets by this zone
  other_usage_today: 0           # credits used today outside this pipeline (same key)
  max_requests_per_second: 2     # far below the 20/s free limit
  probe_limit: 5                 # candles per probe request

hyperliquid:
  # Free Hyperliquid public API: contract metadata snapshots and hourly
  # funding/premium. Candles come from Dwellir. Native candleSnapshot only
  # keeps the last 5000 bars, so it is off by default.
  info_url: https://api.hyperliquid.xyz/info
  ws_url: wss://api.hyperliquid.xyz/ws
  candle_intervals: []
  collect_funding: true
  # Optional forward collector (`leadlag hl-record`): planned option, not a
  # running process. A separately labelled sample; cannot backfill history.
  live:
    channels: [bbo, trades]
    flush_seconds: 60

overnight:
  # Module B: opening/closing forecasts (fixed before looking at results)
  open_cutoffs: ["08:00", "09:00", "09:25", "09:29"]     # ET, next trading day
  close_cutoffs: ["15:30", "15:50", "15:59"]             # ET, same day
  close_anchor: "15:00"                                   # common earlier anchor for closing forecasts
  perp_max_age: "5min"        # last perp bar older than this at a cutoff -> forecast missing
  cash_max_age: "60s"         # TAQ midpoint older than this -> benchmark missing
  adjustment_minutes: [1, 5, 15]

databento:
  # Zero incremental cost policy: every request is quoted with
  # metadata.get_cost immediately before download and allowed only if the
  # quote is exactly 0. There is no setting to raise this.
  # bbo-1s = top of book sampled each second; ohlcv-1m = trade bars (fallback).
  schemas: [bbo-1s, ohlcv-1m]
  allowed_stype_in: [raw_symbol, instrument_id]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "leadlag"
version = "0.1.0"
description = "Lead-lag between Hyperliquid equity perps and US equities / CME futures"
requires-python = ">=3.10"
dependencies = [
  "pandas>=2.0",
  "pyarrow>=14",
  "pyyaml>=6",
  "python-dateutil>=2.8",
  "requests>=2.31",
  "websockets>=12",
  "lz4>=4",
  "wrds>=3.2",
  "databento>=0.40",
]

[project.optional-dependencies]
s3 = ["boto3>=1.34"]

[project.scripts]
leadlag = "leadlag.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "leadlag"
version = "0.1.0"
description = "Lead-lag between Hyperliquid equity perps and US equities / CME futures"
requires-python = ">=3.10"
dependencies = [
  "pandas>=2.0",
  "pyarrow>=14",
  "pyyaml>=6",
  "python-dateutil>=2.8",
  "requests>=2.31",
  "numpy>=1.26",
  "scipy>=1.11",
  "websockets>=12",
  "wrds>=3.2",
  "databento>=0.40",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
notebook = ["matplotlib>=3.8", "nbformat>=5.9", "nbclient>=0.10", "ipykernel>=6.29"]

# `uv run ...` installs this group automatically (doit + tests + notebook execution).
[dependency-groups]
dev = ["doit>=0.36", "pytest>=8", "matplotlib>=3.8", "nbformat>=5.9", "nbclient>=0.10", "ipykernel>=6.29"]

[project.scripts]
leadlag = "leadlag.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore:The 'generic' unit for NumPy timedelta:DeprecationWarning"]
